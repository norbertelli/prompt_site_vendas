[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["prisma/**/*"]

[deploy]
startCommand = "(timeout 60 node node_modules/prisma/build/index.js migrate deploy >/tmp/migrate.log 2>&1 || true) & HOSTNAME=0.0.0.0 PORT=3000 node server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
