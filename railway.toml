[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["prisma/**/*"]

[deploy]
startCommand = "node node_modules/prisma/build/index.js migrate deploy && echo AFTER_MIGRATE_EXIT=$? && pwd && ls -la server.js && HOSTNAME=0.0.0.0 PORT=3000 node server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
